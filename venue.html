<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A6311A">
<title>قائمة الصالة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap">
<style>
:root {
  --bg: #EEF1EE; --surface: #FFFFFF; --surface-2: #E3E9E5; --ink: #17201D; --ink-2: #52605B;
  --line: #D1D9D4; --tea: #A6311A; --tea-ink: #FFFFFF; --ok: #0E6B5F;
  --font-display: 'Lalezar', sans-serif; --font-body: 'IBM Plex Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1514; --surface: #172120; --surface-2: #1F2C2A; --ink: #E7EEEB; --ink-2: #9DB0AA;
    --line: #2A3A37; --tea: #E5755A; --tea-ink: #1A0A06; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding: 0 max(14px, env(safe-area-inset-right)) 100px max(14px, env(safe-area-inset-left)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 520px; margin-inline: auto; }
.brand { font-family: var(--font-display); font-size: 30px; color: var(--tea); margin: 16px 0 4px; }
.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 18px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.name { font-weight: 600; }
.price { font-weight: 600; direction: ltr; unicode-bidi: isolate; }
.meta { color: var(--ink-2); font-size: 13px; }
.btn { background: var(--tea); color: var(--tea-ink); border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; width: 100%; }
.btn:disabled { opacity: 0.45; }
.btn-line { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.qty button { border: 0; background: var(--surface-2); padding: 4px 12px; }
.qty output { min-width: 1.8em; text-align: center; }
.in { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.err { color: var(--tea); font-size: 13px; min-height: 1.2em; }
.note { color: var(--ink-2); font-size: 13px; }
.bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  display: flex; gap: 10px; align-items: center; max-width: 520px; margin-inline: auto; }
.bar b { flex: 1; }
.pill { display: inline-block; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.empty { text-align: center; color: var(--ink-2); padding: 24px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="brand" id="vname">الصالة</div>
  <div class="sub" id="vsub">جاري التحميل...</div>

  <div id="gate-table">
    <h2>رقم طاولتك</h2>
    <div class="card">
      <label class="meta" for="table">اختار الطاولة</label>
      <select class="in" id="table" style="margin-top:6px"></select>
      <p class="note" style="margin:8px 0 0">الطلب يبقى مفتوح على هذي الطاولة حتى ينهيه موظفو الصالة.</p>
      <button class="btn" id="btn-table" style="margin-top:12px">متابعة للقائمة</button>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="row" style="margin-bottom:8px">
      <span class="pill" id="tbl-pill">طاولة</span>
      <button class="btn-line" type="button" id="btn-change-tbl">غيّر الطاولة</button>
    </div>
    <h2>القائمة</h2>
    <div id="list"></div>
    <p class="err" id="err" role="alert"></p>
  </div>

  <div id="done" hidden>
    <div class="card" style="text-align:center">
      <div class="brand" style="font-size:24px">تم إرسال الطلب</div>
      <p class="note">طلبك وصل للصالة على الطاولة <b id="done-tbl"></b>.</p>
      <p class="note">تقدر تضيف طلب ثاني لنفس الطاولة قبل ما ينهون الحساب.</p>
      <button class="btn" id="btn-more" style="margin-top:10px">أضف طلب ثاني</button>
    </div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <b id="total">المجموع: ٠</b>
  <button class="btn" id="btn-send" style="width:auto;padding:10px 18px" disabled>أرسل الطلب</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
var FBCONFIG = { apiKey: 'AIzaSyDT27G2lUpfUPcAMvRIPkllY3bzbQv87Eg', authDomain: 'chaychi-61eaf.firebaseapp.com', projectId: 'chaychi-61eaf', storageBucket: 'chaychi-61eaf.firebasestorage.app', messagingSenderId: '669532553284', appId: '1:669532553284:web:b999af1fc4824c7affbc11' };
var auth, db, fbOK = false;
try {
  firebase.initializeApp(FBCONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  fbOK = true;
} catch (e) { fbOK = false; }

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ar(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function normCode(c) { return String(c || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); }

var ad = null, adId = null, tableNo = 0, cart = {};

function ensureAuth() {
  return new Promise(function (res, rej) {
    if (!fbOK) { rej(new Error('firebase')); return; }
    if (auth.currentUser) { res(auth.currentUser); return; }
    auth.signInAnonymously().then(function (c) { res(c.user); }).catch(rej);
  });
}

function money(p, cur) {
  if (p == null || cur === 'none') return ar(p || 0);
  var n = Number(p);
  if (isNaN(n)) return '';
  return cur === 'usd' ? (n + ' $') : (ar(n) + ' د.ع');
}

function cartTotal() {
  var items = (ad && ad.items) || [], t = 0, cur = (ad && ad.currency) || 'iqd';
  items.forEach(function (it, i) {
    var q = cart[i] || 0;
    if (q) t += q * (Number(it.price) || 0);
  });
  return t;
}

function renderTables() {
  var n = Math.max(1, Math.min(200, Number(ad.tableCount) || 10));
  var sel = $('table');
  var html = '';
  for (var i = 1; i <= n; i++) html += '<option value="' + i + '">طاولة ' + ar(i) + '</option>';
  sel.innerHTML = html;
  try {
    var kept = localStorage.getItem('chaychi-venue-tbl-' + adId);
    if (kept && Number(kept) <= n) sel.value = kept;
  } catch (e) {}
}

function renderMenu() {
  var items = ad.items || [];
  var cur = ad.currency || 'iqd';
  if (!items.length) {
    $('list').innerHTML = '<div class="empty">القائمة فاضية حالياً.</div>';
    return;
  }
  $('list').innerHTML = items.map(function (it, i) {
    var q = cart[i] || 0;
    return '<div class="card"><div class="row"><div><div class="name">' + esc(it.name) + '</div>' +
      (it.desc ? '<div class="meta">' + esc(it.desc) + '</div>' : '') +
      '</div><div class="price">' + esc(money(it.price, cur)) + '</div></div>' +
      '<div class="qty" style="margin-top:8px">' +
      '<button type="button" data-act="dec" data-i="' + i + '">−</button>' +
      '<output>' + ar(q) + '</output>' +
      '<button type="button" data-act="inc" data-i="' + i + '">+</button></div></div>';
  }).join('');
  updateBar();
}

function updateBar() {
  var cur = (ad && ad.currency) || 'iqd';
  var tot = cartTotal();
  var has = Object.keys(cart).some(function (k) { return cart[k] > 0; });
  $('total').textContent = 'المجموع: ' + money(tot, cur);
  $('btn-send').disabled = !has || !tableNo;
  $('bar').hidden = !tableNo;
}

function showMenu() {
  $('gate-table').hidden = true;
  $('menu').hidden = false;
  $('done').hidden = true;
  $('tbl-pill').textContent = 'طاولة ' + ar(tableNo);
  renderMenu();
  updateBar();
}

function loadVenue(code) {
  var c = normCode(code);
  if (c.length < 6) { $('vsub').textContent = 'الرابط غير صحيح.'; return; }
  ensureAuth().then(function () {
    return db.collection('ads').where('ownerCode', '==', c).limit(1).get();
  }).then(function (snap) {
    if (snap.empty) { $('vsub').textContent = 'ماكو صالة مرتبطة بهذا الرابط.'; return; }
    var doc = snap.docs[0];
    ad = doc.data(); adId = doc.id;
    if (ad.pageType !== 'venue') { $('vsub').textContent = 'هذا الرابط مو مخصص لصالة.'; return; }
    if (ad.active === false) { $('vsub').textContent = 'الصالة متوقفة حالياً.'; return; }
    document.title = (ad.shop || 'الصالة') + ' — قائمة';
    $('vname').textContent = ad.shop || 'الصالة';
    $('vsub').textContent = ad.text || 'اختار طاولتك واطلب من القائمة';
    renderTables();
  }).catch(function (e) {
    $('vsub').textContent = 'تعذر التحميل. تأكد من الإنترنت.';
  });
}

$('btn-table').addEventListener('click', function () {
  tableNo = Number($('table').value) || 0;
  if (!tableNo) return;
  try { localStorage.setItem('chaychi-venue-tbl-' + adId, String(tableNo)); } catch (e) {}
  cart = {};
  showMenu();
});

$('btn-change-tbl').addEventListener('click', function () {
  tableNo = 0; cart = {};
  $('menu').hidden = true; $('done').hidden = true; $('gate-table').hidden = false; $('bar').hidden = true;
});

$('btn-more').addEventListener('click', function () {
  cart = {};
  showMenu();
});

$('btn-send').addEventListener('click', function () {
  if (!adId || !tableNo) return;
  var items = ad.items || [];
  var lines = [];
  items.forEach(function (it, i) {
    var q = cart[i] || 0;
    if (q > 0) lines.push({ id: String(i), n: it.name, q: q, p: Number(it.price) || 0 });
  });
  if (!lines.length) { $('err').textContent = 'اختار شيء من القائمة.'; return; }
  var qty = lines.reduce(function (t, l) { return t + l.q; }, 0);
  var total = cartTotal();
  var now = Date.now();
  $('err').textContent = '';
  $('btn-send').disabled = true;
  ensureAuth().then(function (u) {
    var doc = {
      kind: 'venue', adId: adId, customerUid: u.uid, sellerId: 'venue_' + adId,
      sellerName: ad.shop || '', tableNo: tableNo, zone: (ad.zones && ad.zones[0]) || '',
      lines: lines, total: total, qty: qty, phone: 'none',
      loc: 'طاولة ' + tableNo, lat: null, lng: null, pay: 'now',
      status: 'new', open: true, collectCalled: false,
      createdAt: now, statusAt: now, day: new Date().toISOString().slice(0, 10)
    };
    return db.collection('orders').add(doc);
  }).then(function () {
    cart = {};
    $('menu').hidden = true; $('bar').hidden = true; $('done').hidden = false;
    $('done-tbl').textContent = ar(tableNo);
    $('btn-send').disabled = false;
  }).catch(function (e) {
    $('btn-send').disabled = false;
    $('err').textContent = (e && e.message) || 'ما انرسل الطلب. حاول مرة ثانية.';
  });
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var a = t.dataset.act, i = Number(t.dataset.i);
  if (a === 'inc') { cart[i] = Math.min((cart[i] || 0) + 1, 99); renderMenu(); }
  else if (a === 'dec') { cart[i] = Math.max((cart[i] || 0) - 1, 0); renderMenu(); }
});

(function () {
  var q = new URLSearchParams(location.search).get('c') || '';
  if (q) loadVenue(q);
  else $('vsub').textContent = 'افتح الرابط الكامل اللي وصلك من الصالة.';
})();
</script>
</body>
</html>
