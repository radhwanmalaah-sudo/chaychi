<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A6311A">
<title>شايچي</title>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap">
<style>
/* Layout: one phone-width column. Sticky header with zone picker, a loud "nearest seller" block, a quiet list below, bottom tabs for list / my orders. */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --surface-2: #E3E9E5;
  --ink: #17201D;
  --ink-2: #52605B;
  --line: #D1D9D4;
  --tea: #A6311A;
  --tea-ink: #FFFFFF;
  --ok: #0E6B5F;
  --ok-bg: #D5EEE8;
  --busy: #7F5200;
  --busy-bg: #F5E6C3;
  --scrim: rgba(10, 16, 14, 0.5);
  --font-display: 'Lalezar', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #172120; --surface-2: #1F2C2A; --ink: #E7EEEB; --ink-2: #9DB0AA;
    --line: #2A3A37; --tea: #E5755A; --tea-ink: #1A0A06; --ok: #5CD0C0; --ok-bg: #12352F;
    --busy: #E8B95A; --busy-bg: #3A2D10; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #172120; --surface-2: #1F2C2A; --ink: #E7EEEB; --ink-2: #9DB0AA;
  --line: #2A3A37; --tea: #E5755A; --tea-ink: #1A0A06; --ok: #5CD0C0; --ok-bg: #12352F;
  --busy: #E8B95A; --busy-bg: #3A2D10; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tea); outline-offset: 2px; }
.app { max-width: 560px; margin-inline: auto; }
.ico { width: 1.25em; height: 1.25em; flex: none; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px;
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--tea); }
.brand .ico { width: 30px; height: 30px; }
.zone { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; min-width: 0; }
.zone .ico { color: var(--tea); }
.zone select { appearance: none; background: transparent; border: 0; font-weight: 500; padding: 4px 2px; min-width: 0; max-width: 104px; text-overflow: ellipsis; }
.zone select option { color: #17201D; background: #FFFFFF; }

.snd { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--tea); }
.snd[aria-pressed="false"] { color: var(--ink-2); }
.drinks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.drinks span { font-size: 12px; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 0 9px; }
.near .drinks { margin: 0 0 14px; }
.near .drinks span { background: color-mix(in srgb, var(--tea-ink) 18%, transparent); color: var(--tea-ink); }

h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); margin: 22px 0 10px; }

/* nearest seller */
.near { position: relative; overflow: hidden; background: var(--tea); color: var(--tea-ink); border-radius: 20px; padding: 18px 18px 18px; margin-top: 6px; }
.near .deco { position: absolute; left: -18px; bottom: -22px; width: 150px; height: 150px; opacity: 0.16; }
.near .eyebrow { font-size: 13px; font-weight: 500; opacity: 0.9; }
.near .nm { font-family: var(--font-display); font-size: 32px; line-height: 1.2; margin: 2px 0 0; }
.near .eta { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 14px; }
.near .eta b { font-family: var(--font-display); font-size: 54px; line-height: 1; font-weight: 400; }
.near .eta span { font-size: 16px; font-weight: 500; }
.near .meta { font-size: 13px; opacity: 0.92; margin-bottom: 14px; }
.btn-inv { background: var(--tea-ink); color: var(--tea); border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 16px; position: relative; }

/* list */
.list { display: grid; gap: 10px; }
.seller { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--tea); display: grid; place-items: center; }
.avatar .ico { width: 24px; height: 24px; }
.seller .nm { font-weight: 600; font-size: 16px; line-height: 1.3; }
.seller .meta { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.busy { background: var(--busy-bg); color: var(--busy); }
.btn { background: var(--tea); color: var(--tea-ink); border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600; }
.btn:disabled { background: var(--surface-2); color: var(--ink-2); cursor: not-allowed; }
.btn-line { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font-weight: 500; }

.ad { margin-top: 18px; border: 1px dashed var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; color: var(--ink-2); font-size: 13px; }
.ad .tag { font-size: 11px; font-weight: 600; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; flex: none; }
.demo-note { color: var(--ink-2); font-size: 12px; margin: 14px 2px 0; }

/* ads */
.adc { margin-top: 18px; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; }
.adc .top2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.adc .tag { font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.adc .shop { font-family: var(--font-display); font-size: 22px; line-height: 1.3; color: var(--tea); }
.adc .txt { margin: 0; }
.adc .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); font-weight: 600; direction: ltr; }
.adc .ph span { unicode-bidi: plaintext; }
.adc .ph button { direction: rtl; background: var(--surface-2); border: 0; border-radius: 10px; padding: 4px 12px; font-weight: 500; }
.adc .hintx { color: var(--ink-2); font-size: 12px; }
.adc.empty-ad { border-style: dashed; color: var(--ink-2); font-size: 13px; }

/* orders */
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 20px; text-align: center; margin-top: 10px; display: grid; gap: 8px; justify-items: center; }
.empty .ico { width: 44px; height: 44px; color: var(--tea); }
.empty p { margin: 0; color: var(--ink-2); }
.empty strong { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.order { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 10px; }
.order .head { font-family: var(--font-display); font-size: 26px; line-height: 1.3; margin: 0 0 2px; }
.order .sub { color: var(--ink-2); margin: 0 0 14px; }
.steps { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 0; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--ink-2); position: relative; }
.steps li .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; background: var(--surface); }
.steps li.done { color: var(--ink); }
.steps li.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.steps li.now .dot { border-color: var(--tea); }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li:not(:last-child)::after { content: ""; position: absolute; right: 10px; top: 32px; bottom: -8px; width: 2px; background: var(--line); }
.steps li.done:not(:last-child)::after { background: var(--ok); }
.sum { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; font-size: 14px; }
.sum div { display: flex; justify-content: space-between; gap: 12px; }
.sum .tot { font-weight: 600; font-size: 16px; }
.row-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* tabs */
.tabs { position: fixed; inset-inline: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 6;
  padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab { background: transparent; border: 0; border-radius: 12px; padding: 8px; display: grid; justify-items: center; gap: 2px; color: var(--ink-2); font-size: 13px; font-weight: 500; position: relative; }
.tab[aria-current="page"] { color: var(--tea); background: var(--surface-2); font-weight: 600; }
.tab .badge { position: absolute; top: 6px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--tea); }

.pay { border: 0; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; min-width: 0; }
.pay legend { font-weight: 600; font-size: 14px; margin-bottom: 6px; padding: 0; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); cursor: pointer; }
.opt:has(input:checked) { border-color: var(--tea); }
.opt input { margin: 4px 0 0; width: 18px; height: 18px; accent-color: var(--tea); }
.opt b { display: block; font-weight: 600; }
.opt small { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.5; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); max-height: 92%; overflow-y: auto; animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
.sheet-h h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.3; }
.x { background: var(--surface-2); border: 0; border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
.items { display: grid; gap: 4px; margin: 8px 0 14px; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 500; }
.item .p { color: var(--ink-2); font-size: 13px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.step output { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
label.f { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.in { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.err { color: var(--tea); font-size: 13px; margin: 6px 0 0; min-height: 1.2em; }
.hint { color: var(--ink-2); font-size: 12px; margin: 4px 0 0; }
.sheet-f { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.sheet-f .total { font-size: 13px; color: var(--ink-2); }
.sheet-f .total b { display: block; font-size: 20px; color: var(--ink); font-family: var(--font-display); font-weight: 400; }
.sheet-f .btn { padding: 13px 26px; font-size: 16px; }
.mq{display:block;overflow:hidden;white-space:nowrap;direction:ltr;margin-top:18px;background:var(--tea);color:var(--tea-ink);border-radius:12px;padding:8px 0;font-weight:600;text-decoration:none}
.mq-in{display:inline-block;padding-inline-start:100%;animation:mq 14s linear infinite;direction:rtl;unicode-bidi:plaintext}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion: reduce){.mq-in{animation:none;padding:0 12px}.mq{white-space:normal}}
.callbtn,a.tel{display:inline-block;background:var(--tea);color:var(--tea-ink);border-radius:10px;padding:6px 14px;font-weight:600;text-decoration:none}
.adc .ph{direction:rtl}
.instbox{margin-top:14px;text-align:center}
.sw-c{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin:4px}
.sw-c[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.fberr{background:var(--tea);color:var(--tea-ink);border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:14px;font-weight:600}
.fberr[hidden]{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 6h10l-1.1 5.2c-.3 1.4-.3 2.4 0 3.3L17 18H7l1.1-3.5c.3-.9.3-1.9 0-3.3z"/>
      <path d="M5 21h14"/>
      <path d="M10 2.5c-.6.8.6 1.3 0 2.2M14 2.5c-.6.8.6 1.3 0 2.2"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>
    </symbol>
    <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
    </symbol>
    <symbol id="i-snd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
    </symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </symbol>
  </defs>
</svg>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><svg class="ico"><use href="#i-glass"/></svg><span>شايچي</span></div>
    <label class="zone"><svg class="ico"><use href="#i-pin"/></svg>
      <select id="zone" aria-label="المنطقة"></select>
    </label>
    <button class="snd" id="snd" data-act="snd" aria-pressed="true" aria-label="الصوت شغال"></button>
  </header>
  <div class="fberr" id="fberr" hidden role="alert"></div>

  <main id="v-list">
    <button class="btn-line" data-act="locate" style="margin-bottom:10px">حدد موقعي</button>
    <p class="hint" id="locmsg"></p>
    <section id="near"></section>
    <h2>باقي الچايچية بالمنطقة</h2>
    <div class="list" id="list"></div>
    <div id="adslot"></div>
    <button class="btn-line" data-act="test" style="margin-top:10px">جرّب الصوت</button>
    <div class="instbox" id="instbox"><button class="btn-line" data-act="install">ثبّت التطبيق على الشاشة الرئيسية</button><p class="hint" id="instmsg"></p></div>
    <p class="demo-note">إذا ما سمعت شي: تأكد الجوال مو على صامت وارفع صوت الوسائط.</p>
  </main>

  <main id="v-orders" hidden></main>

  <nav class="tabs" aria-label="التنقل"><div class="tabs-in">
    <button class="tab" id="t-list" data-tab="list" aria-current="page"><svg class="ico"><use href="#i-list"/></svg>الچايچية</button>
    <button class="tab" id="t-orders" data-tab="orders"><svg class="ico"><use href="#i-bag"/></svg>طلباتي<span class="badge" id="badge" hidden></span></button>
  </div></nav>

  <div class="scrim" id="scrim" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <div class="sheet-h"><h3 id="sh-title"></h3><button class="x" data-act="close" aria-label="إغلاق"><svg class="ico"><use href="#i-x"/></svg></button></div>
      <div class="items" id="items"></div>
      <label class="f" for="loc">وين أنت؟</label>
      <input class="in" id="loc" type="text" maxlength="80" placeholder="مثال: قدام بوابة الجامعة">
      <button class="btn-line" type="button" data-act="locate" style="margin-top:8px">استخدم موقعي الحالي</button><p class="hint" id="locmsg2"></p>
      <label class="f" for="phone" style="margin-top:12px">رقم جوالك</label>
      <input class="in" id="phone" type="tel" inputmode="tel" maxlength="14" placeholder="07701234567" autocomplete="tel" style="direction:ltr;text-align:end">
      <p class="hint">مطلوب إذا اخترت الدفع وقت لمّ الاستكانات، حتى يتصل بيك الچايچي.</p>
      <fieldset class="pay"><legend>طريقة الدفع</legend>
        <label class="opt"><input type="radio" name="pay" value="now" checked><span><b>عند التسليم</b><small>تدفع نقداً لما يوصلك الچايچي.</small></span></label>
        <label class="opt"><input type="radio" name="pay" value="later"><span><b>وقت لمّ الاستكانات</b><small>تشرب، والچايچي يرجع ياخذ الاستكانات الفارغة والمبلغ.</small></span></label>
      </fieldset>
      <p class="err" id="err" role="alert"></p>
      <div class="sheet-f">
        <div class="total">المجموع<b id="total"></b></div>
        <button class="btn" id="send" data-act="send">ارسل الطلب</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

setInterval(function () { if (!document.hidden && loaded) renderList(); }, 30000);

/* ---------- location ---------- */
function locate(done) {
  var msg = $('locmsg');
  if (!navigator.geolocation) { if (msg) msg.textContent = 'جهازك ما يدعم تحديد الموقع. اكتب مكانك يدوياً.'; if (done) done(false); return; }
  if (msg) msg.textContent = 'نحدد موقعك...';
  navigator.geolocation.getCurrentPosition(function (p) {
    myLoc = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (msg) msg.textContent = 'تم تحديد موقعك. الچايچية مرتبين من الأقرب.';
    renderList();
    var lm = $('locmsg2'); if (lm) lm.textContent = 'تم تحديد موقعك. تقدر تكتب وصف المكان حتى يلكاك أسرع.';
    if (done) done(true);
  }, function (e) {
    var t = e && e.code === 1 ? 'ما سمحت بالموقع. فعّله من إعدادات المتصفح أو اكتب مكانك يدوياً.' : 'ما كدرنا نحدد موقعك. اكتب مكانك يدوياً.';
    if (msg) msg.textContent = t;
    var lm = $('locmsg2'); if (lm) lm.textContent = t;
    if (done) done(false);
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

/* ---------- order sheet ---------- */
function findSeller(id) { return sellers.filter(function (s) { return s.id === id; }).map(decorate)[0]; }
function pickDrinks() { return pick ? menuItems(pick.menu) : []; }
function cartTotal() { return pickDrinks().reduce(function (t, m) { return t + (cart[m.id] || 0) * m.price; }, 0); }
function renderSheet() {
  $('items').innerHTML = pickDrinks().map(function (m) {
    return '<div class="item"><div><div class="t">' + esc(m.name) + '</div><div class="p">' + money(m.price) + '</div></div>' +
      '<div class="step"><button data-act="dec" data-id="' + m.id + '" aria-label="نقّص ' + esc(m.name) + '">−</button>' +
      '<output>' + ar(cart[m.id] || 0) + '</output>' +
      '<button data-act="inc" data-id="' + m.id + '" aria-label="زيّد ' + esc(m.name) + '">+</button></div></div>';
  }).join('');
  $('total').textContent = money(cartTotal());
  $('send').disabled = cartTotal() === 0;
}
function openSheet(id) {
  if (order && order.open && !isFinal(order)) { go('orders'); return; }
  pick = findSeller(id);
  if (!pick) return;
  cart = {};
  var first = pickDrinks()[0];
  if (first) cart[first.id] = 1;
  $('sh-title').textContent = 'طلب من ' + pick.name;
  $('err').textContent = '';
  try { $('phone').value = localStorage.getItem('chaychi-phone') || ''; } catch (e) {}
  $('locmsg2').textContent = myLoc ? 'موقعك محدد. تقدر تكتب وصف المكان حتى يلكاك أسرع.' : '';
  var r0 = document.querySelector('input[name="pay"][value="now"]'); if (r0) r0.checked = true;
  renderSheet();
  $('scrim').hidden = false;
  $('loc').focus();
}
function closeSheet() { $('scrim').hidden = true; }

function sendOrder() {
  var loc = $('loc').value.trim();
  if (cartTotal() === 0) { $('err').textContent = 'اختار شي تطلبه.'; return; }
  if (!loc && !myLoc) { $('err').textContent = 'اكتب وين أنت أو اضغط "حدد موقعي".'; $('loc').focus(); return; }
  var payEl = document.querySelector('input[name="pay"]:checked');
  var pay = payEl ? payEl.value : 'now';
  var rawPh = $('phone').value.trim(), phone = normPhone(rawPh);
  if (rawPh && !phone) { $('err').textContent = 'رقم الجوال غلط. اكتبه أرقام فقط، مثال 07701234567.'; $('phone').focus(); return; }
  if (pay === 'later' && !phone) { $('err').textContent = 'للدفع وقت لمّ الاستكانات اكتب رقم جوالك حتى يتصل بيك الچايچي.'; $('phone').focus(); return; }
  if (blockedSelf) { $('err').textContent = 'حسابك موقوف بسبب طلبات غير مدفوعة. تواصل مع الدعم.'; return; }
  try { if (phone) localStorage.setItem('chaychi-phone', phone); } catch (e) {}
  var lines = pickDrinks().filter(function (m) { return cart[m.id]; }).map(function (m) { return { id: m.id, n: m.name, q: cart[m.id], p: m.price }; });
  var qty = lines.reduce(function (t, l) { return t + l.q; }, 0);
  var now = Date.now();
  var doc = {
    customerUid: myUid, sellerId: pick.id, sellerName: pick.name, zone: zoneId, lines: lines, total: cartTotal(), qty: qty,
    phone: phone || 'none', loc: loc || 'حسب الموقع المحدد', lat: myLoc ? myLoc.lat : null, lng: myLoc ? myLoc.lng : null, pay: pay,
    status: 'new', open: true, collectCalled: false, createdAt: now, statusAt: now, day: dayKey(now)
  };
  $('send').disabled = true;
  var chk = phone ? db.collection('blocked').doc(phone).get() : Promise.resolve({ exists: false });
  chk.then(function (b) {
    if (b.exists) { blockedSelf = true; throw { code: 'blocked' }; }
    return db.collection('orders').add(doc);
  }).then(function (ref) {
    orderId = ref.id; lastStage = null;
    try { localStorage.setItem('chaychi-order', orderId); } catch (e) {}
    closeSheet(); listenOrder(); go('orders');
  }, function (e) { $('err').textContent = (e && (e.code === 'blocked' || e.code === 'permission-denied')) ? 'ما نكدر نستلم طلبك. إذا عليك مبلغ غير مدفوع تواصل مع الدعم.' : errText(e); $('send').disabled = false; });
}

/* ---------- order tracking ---------- */
function stageOf(o) {
  var s = o.status;
  if (s === 'new') return 0;
  if (s === 'accepted') return 1;
  if (s === 'onway') return 2;
  if (s === 'delivered') return 3;
  if (s === 'paid') return o.pay === 'now' ? 3 : 4;
  if (s === 'unpaid') return 4;
  return -1;
}
function isFinal(o) { return o.status === 'cancelled' || o.status === 'rejected' || o.status === 'paid' || o.status === 'unpaid'; }
function listenOrder() {
  if (unsubOrder) { unsubOrder(); unsubOrder = null; }
  if (!orderId) { order = null; renderOrders(); return; }
  unsubOrder = db.collection('orders').doc(orderId).onSnapshot(function (snap) {
    if (!snap.exists) { order = null; orderId = null; try { localStorage.removeItem('chaychi-order'); } catch (e) {} renderOrders(); return; }
    order = snap.data(); order.id = snap.id;
    var st = order.status;
    if (lastStage !== null && lastStage !== st) chime(st === 'delivered' || st === 'paid' ? 'done' : 'ok');
    lastStage = st;
    renderOrders();
  }, function () { renderOrders(); });
}
setInterval(function () {
  if (!order || order.status !== 'new') return;
  if (Date.now() - order.createdAt > ORDER_WAIT) {
    db.collection('orders').doc(order.id).update({ status: 'cancelled', statusAt: Date.now(), open: false }).catch(function () {});
  }
}, 5000);
function callCollect() {
  if (!order || order.pay !== 'later' || order.status !== 'delivered' || order.collectCalled) return;
  db.collection('orders').doc(order.id).update({ collectCalled: true }).catch(function (e) { showErr(errText(e)); });
}
function cancelOrder() {
  if (!order || (order.status !== 'new' && order.status !== 'accepted')) return;
  db.collection('orders').doc(order.id).update({ status: 'cancelled', statusAt: Date.now(), open: false }).catch(function (e) { showErr(errText(e)); });
}
function clearOrder() {
  if (unsubOrder) { unsubOrder(); unsubOrder = null; }
  order = null; orderId = null; lastStage = null;
  try { localStorage.removeItem('chaychi-order'); } catch (e) {}
  go('list');
}
function renderOrders() {
  var el = $('v-orders');
  var live = order && !isFinal(order);
  $('badge').hidden = !live;
  if (!order) {
    el.innerHTML = '<div class="empty">' + glass() + '<strong>ماكو طلب حالياً</strong><p>اختار چايچي من القائمة واطلب استكان چاي.</p>' +
      '<button class="btn" data-act="tolist">شوف الچايچية</button></div>';
    return;
  }
  var o = order, later = o.pay === 'later', st = stageOf(o), head, sub, name = o.sellerName;
  if (o.status === 'cancelled') {
    head = 'انلغى الطلب';
    sub = (o.statusAt - o.createdAt >= ORDER_WAIT - 1000) ? name + ' ما رد بالوقت. جرّب چايچي ثاني.' : 'ما راح يوصلك شي من ' + name + '.';
  }
  else if (o.status === 'rejected') { head = 'الچايچي ما كدر ياخذ طلبك'; sub = name + ' مشغول هسة. جرّب چايچي ثاني.'; }
  else if (st === 0) { head = 'ننتظر ' + name; sub = 'الطلب وصله، ننتظر يقبل.'; }
  else if (st === 1) { head = name + ' قبل طلبك'; sub = 'جاي يجهز استكانك.'; }
  else if (st === 2) { head = 'بالطريق إلك'; sub = 'الچايچي طلع لحد مكانك.'; }
  else if (st === 3) {
    head = 'وصل چايك';
    if (!later) sub = 'بالهنا والشفا. ' + (o.status === 'paid' ? 'تم الدفع، شكراً.' : 'ادفع للچايچي ' + money(o.total) + ' نقداً.');
    else if (o.collectCalled) { head = 'الچايچي جاي يلمّ الاستكانات'; sub = 'جهّز ' + ar(o.qty) + ' استكان فارغ والمبلغ ' + money(o.total) + '.'; }
    else sub = 'بالهنا والشفا. لما تخلص نادِ الچايچي حتى ياخذ الاستكانات والمبلغ ' + money(o.total) + '.';
  }
  else if (o.status === 'unpaid') { head = 'انسجل الطلب'; sub = 'الچايچي ما لكاك وقت اللمّ. المبلغ ' + money(o.total) + ' يبقى عليك.'; }
  else { head = 'تم الدفع'; sub = 'شكراً. استلم الچايچي الاستكانات والمبلغ.'; }
  var dead = o.status === 'cancelled' || o.status === 'rejected';
  var list = later ? STEPS.concat([STEP_PAY]) : STEPS;
  var ds = st >= 3 ? st + 1 : st;
  if (!later && st === 3) ds = 4;
  var steps = dead ? '' : '<ol class="steps">' + list.map(function (s, i) {
    var cls = i < ds ? 'done' : (i === ds ? 'now' : '');
    return '<li class="' + cls + '"><span class="dot">' + (cls === 'done' ? '<svg class="ico" style="width:12px;height:12px"><use href="#i-check"/></svg>' : '') + '</span>' + s + '</li>';
  }).join('') + '</ol>';
  var lines = o.lines.map(function (l) { return '<div><span>' + ar(l.q) + ' × ' + esc(l.n) + '</span><span>' + money(l.q * l.p) + '</span></div>'; }).join('');
  var btns;
  if (isFinal(o)) btns = '<button class="btn" data-act="newOrder">طلب جديد</button>';
  else if (o.status === 'new' || o.status === 'accepted') btns = '<button class="btn-line" data-act="cancel">الغاء الطلب</button>';
  else if (later && o.status === 'delivered' && !o.collectCalled) btns = '<button class="btn" data-act="callcollect">خلصت، نادِ الچايچي</button>';
  else btns = '';
  el.innerHTML = '<div class="order"><h3 class="head">' + esc(head) + '</h3><p class="sub">' + esc(sub) + '</p>' + steps +
    '<div class="sum">' + lines + '<div class="tot"><span>المجموع</span><span>' + money(o.total) + '</span></div>' +
    '<div><span>الدفع</span><span>' + (later ? 'وقت لمّ الاستكانات' : 'نقداً عند التسليم') + '</span></div>' +
    '<div><span>المكان</span><span id="oloc"></span></div></div>' +
    '<div class="row-btns">' + btns + '</div></div>';
  $('oloc').textContent = o.loc;
}

function go(tab) {
  $('v-list').hidden = tab !== 'list';
  $('v-orders').hidden = tab !== 'orders';
  $('t-list').setAttribute('aria-current', tab === 'list' ? 'page' : 'false');
  $('t-orders').setAttribute('aria-current', tab === 'orders' ? 'page' : 'false');
  if (tab === 'orders') renderOrders();
  window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  if (e.target.closest('a[href^="tel:"]')) return;
  var t = e.target.closest('[data-act],[data-tab]');
  if (e.target === $('scrim')) { closeSheet(); return; }
  if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  var a = t.dataset.act, id = t.dataset.id;
  if (a === 'order') openSheet(id);
  else if (a === 'close') closeSheet();
  else if (a === 'inc') { cart[id] = Math.min((cart[id] || 0) + 1, 20); $('err').textContent = ''; renderSheet(); }
  else if (a === 'dec') { cart[id] = Math.max((cart[id] || 0) - 1, 0); renderSheet(); }
  else if (a === 'send') sendOrder();
  else if (a === 'cancel') cancelOrder();
  else if (a === 'newOrder') clearOrder();
  else if (a === 'tolist') go('list');
  else if (a === 'snd') toggleSound();
  else if (a === 'ad') openAd(id);
  else if (a === 'test') { unlock(); chime('done'); }
  else if (a === 'callcollect') callCollect();
  else if (a === 'locate') locate();
  else if (a === 'install') installApp($('instmsg'));
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('scrim').hidden) closeSheet(); });
$('zone').addEventListener('change', function (e) {
  zoneId = e.target.value;
  try { localStorage.setItem('chaychi-zone', zoneId); } catch (err) {}
  listenZone();
});

renderZones();
renderSnd();
renderList();
renderOrders();
var zonesReady = false;
if (isStandalone()) { $('instbox').hidden = true; }
ensureAuth().then(function () {
  db.collection('blocked').doc(myUid).get().then(function (b) { blockedSelf = b.exists; }, function () {});
  watchConfig(function () { renderAd(); });
  watchZones(function () {
    var had = zoneId;
    if (!ZONES.some(function (z) { return z.id === zoneId; })) zoneId = ZONES[0].id;
    renderZones();
    if (!zonesReady) { zonesReady = true; listenZone(); if (orderId) listenOrder(); }
    else if (had !== zoneId) listenZone();
  });
}, function (e) { loaded = true; showErr(errText(e)); renderList(); });

</script>
</body>
</html>
