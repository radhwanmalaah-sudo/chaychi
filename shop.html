<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A6311A">
<title>صفحة المحل — مصلاوي اون لاين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap">
<style>
:root {
  --bg: #EEF1EE; --surface: #FFFFFF; --surface-2: #E3E9E5; --ink: #17201D; --ink-2: #52605B;
  --line: #D1D9D4; --tea: #A6311A; --tea-ink: #FFFFFF; --ok: #0E6B5F; --ok-bg: #D5EEE8;
  --font-display: 'Lalezar', sans-serif; --font-body: 'IBM Plex Sans Arabic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1514; --surface: #172120; --surface-2: #1F2C2A; --ink: #E7EEEB; --ink-2: #9DB0AA;
    --line: #2A3A37; --tea: #E5755A; --tea-ink: #1A0A06; --ok: #5CD0C0; --ok-bg: #12352F; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding: 0 max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 560px; margin-inline: auto; }
.brand { font-family: var(--font-display); font-size: 28px; color: var(--tea); margin: 18px 0 6px; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-2); margin: 22px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 8px; margin-bottom: 10px; }
.shop { font-family: var(--font-display); font-size: 22px; line-height: 1.3; }
.meta { color: var(--ink-2); font-size: 13px; }
.btn { background: var(--tea); color: var(--tea-ink); border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 600; }
.btn-line { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 500; font-size: 14px; }
.btn-line.danger { color: var(--tea); border-color: var(--tea); }
.btn-ok { background: var(--ok); color: #fff; border: 0; border-radius: 12px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
.in { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.in.code { direction: ltr; text-align: center; font-size: 22px; letter-spacing: 0.25em; font-weight: 600; }
label.f { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.err { color: var(--tea); font-size: 13px; min-height: 1.2em; }
.note { color: var(--ink-2); font-size: 13px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
form.g { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 9px 4px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--tea); font-weight: 600; }
.empty { text-align: center; color: var(--ink-2); padding: 20px; }
.price { font-weight: 600; direction: ltr; unicode-bidi: isolate; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">مصلاوي اون لاين — صفحة المحل</div>

  <section id="gate">
    <p class="note">أدخل كود الدخول اللي وصلك من صاحب التطبيق.</p>
    <form class="g" id="f-login" novalidate>
      <div><label class="f" for="code">كود الدخول</label>
        <input class="in code" id="code" maxlength="10" autocomplete="off" placeholder="XXXXXXXX"></div>
      <p class="err" id="lerr" role="alert"></p>
      <button class="btn" type="submit">دخول</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="card">
      <div class="shop" id="shopname"></div>
      <div class="meta" id="shopmeta"></div>
      <div class="btns" style="margin-top:6px">
        <button class="btn-line" data-act="logout">خروج</button>
      </div>
    </div>

    <div id="sales-tools">
      <h2>عملة الأسعار</h2>
      <div class="seg" id="curseg">
        <button type="button" data-act="cur" data-v="iqd">دينار</button>
        <button type="button" data-act="cur" data-v="usd">دولار</button>
        <button type="button" data-act="cur" data-v="none">بلا سعر</button>
      </div>
      <p class="note" id="curnote"></p>
    </div>

    <div id="venue-tools" hidden>
      <h2>عدد الطاولات</h2>
      <div class="card">
        <div class="row">
          <span class="meta">الطاولات مرقّمة من ١ إلى العدد اللي تحدده</span>
          <div style="display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden">
            <button type="button" data-act="tbl-dec" style="border:0;background:var(--surface-2);padding:6px 14px">−</button>
            <output id="tbl-n" style="min-width:2.5em;text-align:center;font-weight:600">١٠</output>
            <button type="button" data-act="tbl-inc" style="border:0;background:var(--surface-2);padding:6px 14px">+</button>
          </div>
        </div>
        <p class="note" id="venue-link-note" style="margin:8px 0 0"></p>
        <div class="btns"><button class="btn-line" data-act="copy-venue" type="button">انسخ رابط الزبائن</button></div>
      </div>
    </div>

    <div id="orders-box" hidden>
      <h2>طلبات واردة <span id="ocnt"></span></h2>
      <p class="note" id="ord-note">مهم: اتصل بالزبون أولاً وتأكد من الطلب قبل القبول — حتى ما يصير تلاعب أو طلب وهمي.</p>
      <div id="olist"></div>
    </div>

    <h2 id="list-title">عروضك <span id="icnt"></span></h2>
    <div id="ilist"></div>

    <h2 id="form-title">أضف عنصر</h2>
    <form class="g" id="f-item" novalidate>
      <div><label class="f" for="iname" id="iname-lab">الاسم</label>
        <input class="in" id="iname" maxlength="40" placeholder=""></div>
      <div id="pricebox"><label class="f" for="iprice">السعر</label>
        <input class="in" id="iprice" type="number" inputmode="decimal" min="0" step="any" maxlength="12" placeholder="مثال: 120000"></div>
      <div><label class="f" for="idesc">وصف مختصر (اختياري)</label>
        <input class="in" id="idesc" maxlength="80" placeholder="جملة قصيرة"></div>
      <p class="err" id="ierr" role="alert"></p>
      <button class="btn" type="submit" id="f-item-btn">أضف</button>
    </form>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
var FBCONFIG = { apiKey: 'AIzaSyDT27G2lUpfUPcAMvRIPkllY3bzbQv87Eg', authDomain: 'chaychi-61eaf.firebaseapp.com', projectId: 'chaychi-61eaf', storageBucket: 'chaychi-61eaf.firebasestorage.app', messagingSenderId: '669532553284', appId: '1:669532553284:web:b999af1fc4824c7affbc11' };
var auth, db, fbOK = false;
try {
  firebase.initializeApp(FBCONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  fbOK = true;
} catch (e) { fbOK = false; }

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ar(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function normCode(c) { return String(c || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); }

var ad = null, adId = null, unsub = null, unsubOrders = null, adOrders = [];
var CUR_L = { iqd: 'دينار عراقي', usd: 'دولار', none: 'بدون سعر' };
function isVenue() { return ad && ad.pageType === 'venue'; }
function isSales() { return !ad || (ad.pageType !== 'services'); } // sales + venue both have products
function moneyOrd(n, cur) {
  if (n == null || cur === 'none') return ar(n || 0);
  return cur === 'usd' ? (n + ' $') : (ar(n) + ' د.ع');
}

function ensureAuth() {
  return new Promise(function (res, rej) {
    if (!fbOK) { rej(new Error('firebase')); return; }
    if (auth.currentUser) { res(auth.currentUser); return; }
    auth.signInAnonymously().then(function (c) { res(c.user); }).catch(rej);
  });
}

function money(p, cur) {
  if (p == null || p === '' || cur === 'none') return '';
  var n = Number(p);
  if (isNaN(n)) return '';
  if (cur === 'usd') return n + ' $';
  return ar(n) + ' د.ع';
}

function renderCur() {
  var sales = isSales();
  $('sales-tools').hidden = !sales;
  if (!sales) return;
  var cur = (ad && ad.currency) || 'none';
  Array.prototype.forEach.call(document.querySelectorAll('#curseg button'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.v === cur));
  });
  $('curnote').textContent = cur === 'none' ? 'المنتجات تظهر بدون أسعار.' : 'الأسعار بال' + CUR_L[cur] + '.';
  $('pricebox').hidden = cur === 'none';
}

function renderItems() {
  var items = (ad && ad.items) || [];
  var sales = isSales();
  $('icnt').textContent = items.length ? '(' + ar(items.length) + ')' : '';
  var venue = isVenue();
  var lab = venue ? 'قائمتك ' : (sales ? 'منتجاتك ' : 'خدماتك ');
  $('list-title').innerHTML = lab + '<span id="icnt">' + (items.length ? '(' + ar(items.length) + ')' : '') + '</span>';
  $('form-title').textContent = venue ? 'أضف صنف' : (sales ? 'أضف منتج' : 'أضف خدمة');
  $('iname-lab').textContent = venue ? 'اسم الصنف' : (sales ? 'اسم المنتج' : 'اسم الخدمة');
  $('iname').placeholder = venue ? 'مثال: استكان چاي، شيشة، بركر' : (sales ? 'مثال: تليفون، طباعة، كيس رز' : 'مثال: تصميم مخططات، صيانة مكيفات');
  $('f-item-btn').textContent = venue ? 'أضف للقائمة' : (sales ? 'أضف المنتج' : 'أضف الخدمة');
  $('pricebox').hidden = !sales || (ad.currency || 'none') === 'none';
  if (!items.length) {
    $('ilist').innerHTML = '<div class="empty">' + (sales ? 'ماكو منتجات بعد. أضف أول منتج من الفورم تحت.' : 'ماكو خدمات بعد. أضف أول خدمة من الفورم تحت.') + '</div>';
    return;
  }
  var cur = ad.currency || 'none';
  $('ilist').innerHTML = items.map(function (it, i) {
    return '<div class="card"><div class="row"><div><div class="shop" style="font-size:18px">' + esc(it.name) + '</div>' +
      '<div class="meta">' +
      (sales && it.price != null && it.price !== '' && cur !== 'none' ? '<span class="price">' + esc(money(it.price, cur)) + '</span>' : '<span class="pill">' + (sales ? 'منتج' : 'خدمة') + '</span>') +
      '</div>' + (it.desc ? '<div class="meta">' + esc(it.desc) + '</div>' : '') +
      '</div><button class="btn-line danger" data-act="delitem" data-i="' + i + '">احذف</button></div></div>';
  }).join('');
}

function renderAll() {
  if (!ad) return;
  var sales = isSales();
  var venue = isVenue();
  $('shopname').textContent = ad.shop || 'المحل';
  var kind = venue ? 'صفحة صالة / كافتريا' : (ad.pageType === 'services' ? 'صفحة خدمات' : 'صفحة مبيعات');
  $('shopmeta').textContent = kind + (ad.phone ? ' · ' + ad.phone : '') + (ad.text ? ' · ' + ad.text : '');
  $('venue-tools').hidden = !venue;
  if (venue) {
    var n = Math.max(1, Math.min(200, Number(ad.tableCount) || 10));
    $('tbl-n').textContent = ar(n);
    var vlink = 'https://radhwanmalaah-sudo.github.io/mousl-online/venue.html?c=' + encodeURIComponent(ad.ownerCode || '');
    $('venue-link-note').innerHTML = 'رابط الزبائن: <span dir="ltr" style="word-break:break-all">' + esc(vlink) + '</span>';
    window._venueLink = vlink;
  }
  renderCur();
  renderItems();
  renderOrders();
}

function renderOrders() {
  var box = $('orders-box'), list = $('olist');
  if (!box || !list) return;
  if (!isSales() && !isVenue()) { box.hidden = true; return; }
  // sales + venue show orders
  box.hidden = false;
  var note = $('ord-note');
  if (note) note.textContent = isVenue()
    ? 'الطلبات حسب رقم الطاولة. الطلب يبقى مفتوح حتى تضغط إنهاء بعد الدفع أو الاستلام. الزبون يقدر يضيف طلبات إضافية لنفس الطاولة.'
    : 'مهم: اتصل بالزبون أولاً وتأكد من الطلب قبل القبول — حتى ما يصير تلاعب أو طلب وهمي.';
  var open = adOrders.filter(function (o) { return o.open !== false && o.status !== 'cancelled' && o.status !== 'rejected'; });
  $('ocnt').textContent = open.length ? '(' + ar(open.length) + ')' : '';
  if (!open.length) {
    list.innerHTML = '<div class="empty">ماكو طلبات حالياً.</div>';
    return;
  }
  var cur = (ad && ad.currency) || 'iqd';
  list.innerHTML = open.map(function (o) {
    var lines = (o.lines || []).map(function (l) {
      return esc(l.n) + ' × ' + ar(l.q);
    }).join(' · ');
    var st = o.status || 'new';
    var venue = isVenue();
    var stL = venue
      ? ({ open: 'مفتوح', new: 'مفتوح', accepted: 'مفتوح', delivered: 'منتهي', closed: 'منتهي', rejected: 'مرفوض', cancelled: 'ملغي' }[st] || st)
      : ({ new: 'جديد — اتصل للتأكيد', accepted: 'مقبول', onway: 'بالطريق', delivered: 'تم التسليم', rejected: 'مرفوض' }[st] || st);
    var btns = '';
    if (venue) {
      if (st === 'new' || st === 'open' || st === 'accepted') {
        btns = '<button class="btn" data-act="o-done" data-id="' + esc(o.id) + '">إنهاء الطلب (تم الدفع/الاستلام)</button>' +
          '<button class="btn-line danger" data-act="o-no" data-id="' + esc(o.id) + '">إلغاء</button>';
      }
    } else if (st === 'new') {
      btns = '<a class="btn-ok" href="tel:' + esc(o.phone) + '">اتصل بالزبون</a>' +
        '<button class="btn" data-act="o-ok" data-id="' + esc(o.id) + '">قبول بعد التأكيد</button>' +
        '<button class="btn-line danger" data-act="o-no" data-id="' + esc(o.id) + '">رفض</button>';
    } else if (st === 'accepted') {
      btns = '<button class="btn" data-act="o-way" data-id="' + esc(o.id) + '">طلعت بالطريق</button>';
    } else if (st === 'onway') {
      btns = '<button class="btn" data-act="o-done" data-id="' + esc(o.id) + '">تم التسليم</button>';
    }
    var head = venue ? ('طاولة ' + ar(o.tableNo || '?')) : esc(o.phone || '');
    return '<div class="card">' +
      '<div class="row"><div class="shop" style="font-size:18px">' + head + '</div><span class="pill' + ((st === 'new' || st === 'open' || st === 'accepted') ? ' ok' : '') + '">' + stL + '</span></div>' +
      '<div class="meta">' + lines + '</div>' +
      '<div class="meta">المجموع: <b class="price">' + esc(moneyOrd(o.total, cur)) + '</b>' + (o.phone && o.phone !== 'none' ? ' · ' + esc(o.phone) : '') + (o.loc ? ' · ' + esc(o.loc) : '') + '</div>' +
      (btns ? '<div class="btns" style="margin-top:8px">' + btns + '</div>' : '') +
      '</div>';
  }).join('');
}

function setOrderStatus(id, status) {
  var patch = { status: status, statusAt: Date.now() };
  if (status === 'delivered' || status === 'rejected' || status === 'cancelled') patch.open = false;
  if (status === 'delivered') patch.deliveredAt = Date.now();
  db.collection('orders').doc(id).update(patch).catch(function (e) { alert(e.message || 'ما انحفظ'); });
}

function openApp(id, data) {
  adId = id; ad = data; ad.id = id;
  $('gate').hidden = true; $('app').hidden = false;
  if (unsub) unsub();
  if (unsubOrders) { unsubOrders(); unsubOrders = null; }
  // اربط حساب الدخول كمالك الصفحة (لحماية الطلبات)
  ensureAuth().then(function (u) {
    if (u && (!data.ownerUid || data.ownerUid === u.uid)) {
      db.collection('ads').doc(id).update({ ownerUid: u.uid }).catch(function () {});
    }
  });
  unsub = db.collection('ads').doc(id).onSnapshot(function (snap) {
    if (!snap.exists) { logout('انحذف الإعلان.'); return; }
    ad = snap.data(); ad.id = id;
    renderAll();
  }, function (e) { $('lerr').textContent = e.message || 'خطأ'; });
  unsubOrders = db.collection('orders').where('adId', '==', id).orderBy('createdAt', 'desc').limit(30)
    .onSnapshot(function (s) {
      adOrders = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
      renderOrders();
    }, function () {
      // إذا ماكو index، جرب بدون orderBy
      unsubOrders = db.collection('orders').where('adId', '==', id).limit(30)
        .onSnapshot(function (s2) {
          adOrders = s2.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
          adOrders.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
          renderOrders();
        }, function () {});
    });
  renderAll();
  renderOrders();
}

function logout(msg) {
  if (unsub) { unsub(); unsub = null; }
  if (unsubOrders) { unsubOrders(); unsubOrders = null; }
  ad = null; adId = null; adOrders = [];
  $('app').hidden = true; $('gate').hidden = false;
  $('code').value = '';
  if (msg) $('lerr').textContent = msg;
}

function loginWith(code) {
  var c = normCode(code);
  if (c.length < 6) { $('lerr').textContent = 'اكتب الكود كامل.'; return; }
  $('lerr').textContent = '';
  ensureAuth().then(function () {
    return db.collection('ads').where('ownerCode', '==', c).limit(1).get();
  }).then(function (snap) {
    if (snap.empty) { $('lerr').textContent = 'الكود غلط أو ماكو إعلان مرتبط فيه.'; return; }
    var doc = snap.docs[0];
    try { localStorage.setItem('chaychi-shop-code', c); } catch (e) {}
    openApp(doc.id, doc.data());
  }).catch(function (e) {
    $('lerr').textContent = (e && e.message) || 'تعذر الدخول. تأكد من الإنترنت.';
  });
}

$('f-login').addEventListener('submit', function (e) {
  e.preventDefault();
  loginWith($('code').value);
});

$('f-item').addEventListener('submit', function (e) {
  e.preventDefault();
  if (!adId || !ad) return;
  var name = $('iname').value.trim();
  var sales = isSales();
  var type = sales ? 'sale' : 'service';
  var priceRaw = $('iprice').value.trim();
  var desc = $('idesc').value.trim();
  var cur = ad.currency || 'none';
  var err = '';
  if (!name) err = sales ? 'اكتب اسم المنتج.' : 'اكتب اسم الخدمة.';
  else if (sales && cur !== 'none' && priceRaw === '') err = 'اكتب السعر أو غيّر العملة إلى بلا.';
  $('ierr').textContent = err;
  if (err) return;
  var item = { name: name, type: type, desc: desc || '' };
  if (sales && cur !== 'none' && priceRaw !== '') {
    var p = Number(String(priceRaw).replace(/[^\d.]/g, ''));
    if (isNaN(p) || p < 0 || p > 999999999) { $('ierr').textContent = 'السعر من ٠ إلى ٩٩٩٬٩٩٩٬٩٩٩.'; return; }
    item.price = p;
  }
  var items = (ad.items || []).slice();
  items.push(item);
  db.collection('ads').doc(adId).update({ items: items }).then(function () {
    $('iname').value = ''; $('iprice').value = ''; $('idesc').value = '';
    $('ierr').textContent = '';
  }).catch(function (e) { $('ierr').textContent = e.message || 'ما انحفظ.'; });
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var a = t.dataset.act;
  if (a === 'logout') {
    try { localStorage.removeItem('chaychi-shop-code'); } catch (x) {}
    logout();
  } else if (a === 'cur' && adId) {
    var v = t.dataset.v;
    db.collection('ads').doc(adId).update({ currency: v }).catch(function () {});
  } else if (a === 'delitem' && adId) {
    var i = Number(t.dataset.i);
    var items = (ad.items || []).slice();
    if (i >= 0 && i < items.length) {
      items.splice(i, 1);
      db.collection('ads').doc(adId).update({ items: items }).catch(function () {});
    }
  } else if (a === 'o-ok') setOrderStatus(t.dataset.id, 'accepted');
  else if (a === 'o-no') setOrderStatus(t.dataset.id, 'rejected');
  else if (a === 'o-way') setOrderStatus(t.dataset.id, 'onway');
  else if (a === 'o-done') setOrderStatus(t.dataset.id, 'delivered');
  else if (a === 'tbl-inc' || a === 'tbl-dec') {
    if (!adId || !ad) return;
    var n = Math.max(1, Math.min(200, Number(ad.tableCount) || 10));
    n = a === 'tbl-inc' ? n + 1 : n - 1;
    n = Math.max(1, Math.min(200, n));
    db.collection('ads').doc(adId).update({ tableCount: n }).catch(function () {});
  } else if (a === 'copy-venue') {
    var link = window._venueLink || '';
    if (!link) return;
    try {
      navigator.clipboard.writeText(link).then(function () { t.textContent = 'تم النسخ'; setTimeout(function () { t.textContent = 'انسخ رابط الزبائن'; }, 1500); });
    } catch (e) { prompt('انسخ الرابط:', link); }
  }
});

/* auto-login from URL or storage */
(function () {
  var q = new URLSearchParams(location.search).get('c') || '';
  var kept = '';
  try { kept = localStorage.getItem('chaychi-shop-code') || ''; } catch (e) {}
  var code = normCode(q || kept);
  if (code) {
    $('code').value = code;
    loginWith(code);
  }
})();
</script>
